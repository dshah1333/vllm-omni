<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
  <title id="title">No-AllGather DLO shared host weights and independent runtime orchestration</title>
  <desc id="desc">An external orchestrator routes requests to two independently scheduled diffusion engines on one node. Each engine has its own loader, mmap view, DLO runtime hooks, streams, events, and GPU device slots. Both engines map the same immutable runtime-cache weight pages stored at the bottom of the diagram, without a cross-engine DLO AllGather. TP1 is shown; tensor parallel deployments repeat one shared cache entry per TP coordinate.</desc>
  <defs>
    <marker id="request-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="mapping-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="runtime-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; stroke: #e2e8f0; }
      .node { fill: #f8fafc; stroke: #cbd5e1; }
      .engine { fill: #ffffff; stroke: #cbd5e1; }
      .router { fill: #f5f3ff; stroke: #c4b5fd; }
      .scope { fill: #f8fafc; stroke: #cbd5e1; }
      .cache { fill: #fff7ed; stroke: #fdba74; }
      .payload { fill: #d97706; }
      .loader { fill: #f1f5f9; stroke: #cbd5e1; }
      .mapping { fill: #fffbeb; stroke: #f59e0b; }
      .hook { fill: #eff6ff; stroke: #60a5fa; }
      .gpu { fill: #f0fdf4; stroke: #86efac; }
      .slot-current { fill: #16a34a; }
      .slot-next { fill: #bbf7d0; stroke: #22c55e; }
      .no-collective { fill: #fef2f2; stroke: #fca5a5; }
      .title { font: 700 25px system-ui, -apple-system, Segoe UI, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 13px system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
      .section { font: 700 15px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .section-sub { font: 500 11.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #64748b; }
      .eyebrow { font: 700 10px system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: .8px; fill: #64748b; }
      .box-title { font: 700 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #1e293b; }
      .box-text { font: 500 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .payload-title { font: 700 14px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .payload-text { font: 500 11px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .slot-text { font: 700 9px system-ui, -apple-system, Segoe UI, sans-serif; fill: #ffffff; }
      .slot-next-text { font: 700 9px system-ui, -apple-system, Segoe UI, sans-serif; fill: #166534; }
      .arrow-label { font: 600 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #475569; }
      .request-label { font: 600 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #6d28d9; }
      .mapping-label { font: 600 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #b45309; }
      .no-title { font: 700 12px system-ui, -apple-system, Segoe UI, sans-serif; fill: #b91c1c; }
      .no-text { font: 500 10.5px system-ui, -apple-system, Segoe UI, sans-serif; fill: #7f1d1d; }
      .request-path { fill: none; stroke: #7c3aed; stroke-width: 2; marker-end: url(#request-arrow); }
      .mapping-path { fill: none; stroke: #d97706; stroke-width: 2; marker-end: url(#mapping-arrow); }
      .runtime-path { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#runtime-arrow); }
      .startup-path { fill: none; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#runtime-arrow); }
    </style>
  </defs>

  <rect x="12" y="12" width="1256" height="826" rx="14" class="canvas"/>

  <text id="title-text" x="40" y="50" class="title">No-AllGather DLO: one shared host payload, independent runtimes</text>
  <text x="40" y="74" class="subtitle">TP1 shown; TP&gt;1 repeats this mapping once per TP coordinate, shared by equivalent workers across engines</text>

  <!-- The control plane remains outside DLO. -->
  <rect x="390" y="94" width="500" height="68" rx="10" class="router"/>
  <text x="640" y="121" text-anchor="middle" class="section">External router / orchestrator</text>
  <text x="640" y="144" text-anchor="middle" class="section-sub">independent request placement &#183; outside vLLM-Omni DLO</text>

  <!-- One node contains independent engine runtimes over one shared physical backing. -->
  <rect x="30" y="184" width="1220" height="634" rx="14" class="node"/>
  <text x="52" y="211" class="eyebrow">ONE NODE &#183; PROCESS-LOCAL ENGINES OVER SHARED PHYSICAL HOST MEMORY</text>

  <!-- Independent request routing from the external orchestrator. -->
  <path d="M 500 162 C 456 181, 400 204, 332 232" class="request-path"/>
  <text x="416" y="194" class="request-label">request A</text>
  <path d="M 780 162 C 824 181, 880 204, 948 232" class="request-path"/>
  <text x="864" y="194" class="request-label">request B</text>

  <!-- Independent engine A. -->
  <rect x="45" y="232" width="575" height="250" rx="12" class="engine"/>
  <text x="68" y="261" class="section">Independent engine A</text>
  <text x="68" y="281" class="section-sub">own request schedule &#183; own DLO backend state</text>

  <rect x="68" y="310" width="115" height="130" rx="8" class="loader"/>
  <text x="125" y="335" text-anchor="middle" class="eyebrow">STARTUP</text>
  <text x="125" y="360" text-anchor="middle" class="box-title">ordinary loader</text>
  <text x="125" y="384" text-anchor="middle" class="box-text">final transforms</text>
  <text x="125" y="403" text-anchor="middle" class="box-text">publish / join</text>
  <text x="125" y="422" text-anchor="middle" class="box-text">runtime cache</text>

  <rect x="201" y="310" width="125" height="130" rx="8" class="mapping"/>
  <text x="263" y="335" text-anchor="middle" class="eyebrow">HOST VIEW</text>
  <text x="263" y="360" text-anchor="middle" class="box-title">mmap of shared</text>
  <text x="263" y="378" text-anchor="middle" class="box-title">weight pages</text>
  <text x="263" y="403" text-anchor="middle" class="box-text">process-local view</text>
  <text x="263" y="422" text-anchor="middle" class="box-text">optional registration</text>

  <rect x="344" y="310" width="135" height="130" rx="8" class="hook"/>
  <text x="411" y="335" text-anchor="middle" class="eyebrow">RUNTIME CONTROL</text>
  <text x="411" y="360" text-anchor="middle" class="box-title">DLO backend</text>
  <text x="411" y="378" text-anchor="middle" class="box-title">+ block hook</text>
  <text x="411" y="403" text-anchor="middle" class="box-text">select &#183; prefetch</text>
  <text x="411" y="422" text-anchor="middle" class="box-text">repoint &#183; rotate</text>

  <rect x="497" y="310" width="100" height="130" rx="8" class="gpu"/>
  <text x="547" y="335" text-anchor="middle" class="eyebrow">GPU A</text>
  <text x="547" y="355" text-anchor="middle" class="box-text">two device slots</text>
  <rect x="510" y="373" width="74" height="24" rx="5" class="slot-current"/>
  <text x="547" y="389" text-anchor="middle" class="slot-text">SLOT 0 &#183; NOW</text>
  <rect x="510" y="404" width="74" height="24" rx="5" class="slot-next"/>
  <text x="547" y="420" text-anchor="middle" class="slot-next-text">SLOT 1 &#183; NEXT</text>

  <path d="M 183 375 L 201 375" class="startup-path"/>
  <path d="M 326 375 L 344 375" class="runtime-path"/>
  <path d="M 479 375 L 497 375" class="runtime-path"/>

  <!-- Independent engine B. -->
  <rect x="660" y="232" width="575" height="250" rx="12" class="engine"/>
  <text x="683" y="261" class="section">Independent engine B</text>
  <text x="683" y="281" class="section-sub">own request schedule &#183; own DLO backend state</text>

  <rect x="683" y="310" width="115" height="130" rx="8" class="loader"/>
  <text x="740" y="335" text-anchor="middle" class="eyebrow">STARTUP</text>
  <text x="740" y="360" text-anchor="middle" class="box-title">ordinary loader</text>
  <text x="740" y="384" text-anchor="middle" class="box-text">final transforms</text>
  <text x="740" y="403" text-anchor="middle" class="box-text">publish / join</text>
  <text x="740" y="422" text-anchor="middle" class="box-text">runtime cache</text>

  <rect x="816" y="310" width="125" height="130" rx="8" class="mapping"/>
  <text x="878" y="335" text-anchor="middle" class="eyebrow">HOST VIEW</text>
  <text x="878" y="360" text-anchor="middle" class="box-title">mmap of shared</text>
  <text x="878" y="378" text-anchor="middle" class="box-title">weight pages</text>
  <text x="878" y="403" text-anchor="middle" class="box-text">process-local view</text>
  <text x="878" y="422" text-anchor="middle" class="box-text">optional registration</text>

  <rect x="959" y="310" width="135" height="130" rx="8" class="hook"/>
  <text x="1026" y="335" text-anchor="middle" class="eyebrow">RUNTIME CONTROL</text>
  <text x="1026" y="360" text-anchor="middle" class="box-title">DLO backend</text>
  <text x="1026" y="378" text-anchor="middle" class="box-title">+ block hook</text>
  <text x="1026" y="403" text-anchor="middle" class="box-text">select &#183; prefetch</text>
  <text x="1026" y="422" text-anchor="middle" class="box-text">repoint &#183; rotate</text>

  <rect x="1112" y="310" width="100" height="130" rx="8" class="gpu"/>
  <text x="1162" y="335" text-anchor="middle" class="eyebrow">GPU B</text>
  <text x="1162" y="355" text-anchor="middle" class="box-text">two device slots</text>
  <rect x="1125" y="373" width="74" height="24" rx="5" class="slot-current"/>
  <text x="1162" y="389" text-anchor="middle" class="slot-text">SLOT 0 &#183; NOW</text>
  <rect x="1125" y="404" width="74" height="24" rx="5" class="slot-next"/>
  <text x="1162" y="420" text-anchor="middle" class="slot-next-text">SLOT 1 &#183; NEXT</text>

  <path d="M 798 375 L 816 375" class="startup-path"/>
  <path d="M 941 375 L 959 375" class="runtime-path"/>
  <path d="M 1094 375 L 1112 375" class="runtime-path"/>

  <!-- The runtimes are deliberately not coupled by a DLO collective. -->
  <rect x="365" y="516" width="550" height="44" rx="8" class="no-collective"/>
  <circle cx="395" cy="538" r="12" fill="#dc2626"/>
  <path d="M 389 532 L 401 544 M 401 532 L 389 544" stroke="#ffffff" stroke-width="2.2"/>
  <text x="420" y="534" class="no-title">No cross-engine DLO AllGather</text>
  <text x="420" y="551" class="no-text">shared host pages do not couple request order, progress, or failure domains</text>
  <text x="640" y="592" text-anchor="middle" class="section-sub">Ordinary TP / SP model collectives, when configured, remain inside each engine</text>

  <!-- Runtime mmap views point to one physical host payload at the bottom. -->
  <path d="M 455 650 C 412 625, 340 610, 340 570 L 340 525 C 340 478, 300 454, 263 440" class="mapping-path"/>
  <text x="300" y="617" text-anchor="middle" class="mapping-label">same pages</text>
  <path d="M 825 650 C 868 625, 940 610, 940 570 L 940 525 C 940 478, 908 454, 878 440" class="mapping-path"/>
  <text x="980" y="617" text-anchor="middle" class="mapping-label">same pages</text>

  <!-- One node-local physical backing, visually beneath its consumers. -->
  <rect x="58" y="650" width="242" height="140" rx="10" class="scope"/>
  <text x="78" y="676" class="eyebrow">SHARING SCOPE</text>
  <text x="78" y="702" class="box-title">TP1: one full cache entry</text>
  <text x="78" y="725" class="box-text">TP&gt;1: one entry per TP coordinate</text>
  <text x="78" y="746" class="box-text">Equivalent engines reuse that entry;</text>
  <text x="78" y="767" class="box-text">different TP ranks never alias layouts.</text>

  <rect x="330" y="650" width="620" height="140" rx="10" class="cache"/>
  <text x="350" y="676" class="eyebrow">NODE-LOCAL IMMUTABLE RUNTIME CACHE</text>
  <rect x="370" y="692" width="540" height="60" rx="8" class="payload"/>
  <text x="640" y="717" text-anchor="middle" class="payload-title">1&#215; physical runtime-weight payload</text>
  <text x="640" y="738" text-anchor="middle" class="payload-text">file-backed tensor pages shared by the OS page cache</text>
  <text x="640" y="773" text-anchor="middle" class="box-text">Identity includes final layout + TP coordinate; engine and DP replica are excluded</text>

  <rect x="980" y="650" width="242" height="140" rx="10" class="scope"/>
  <text x="1000" y="676" class="eyebrow">WHAT STAYS PRIVATE</text>
  <text x="1000" y="702" class="box-title">Per worker / process</text>
  <text x="1000" y="725" class="box-text">mmap object and validation state</text>
  <text x="1000" y="746" class="box-text">optional host registration</text>
  <text x="1000" y="767" class="box-text">hooks, streams, events, GPU slots</text>
</svg>
